<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Entertainment Fansite</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0f0f0f;
color:#f5f5f5;
transition:.4s;
}

.hidden{
display:none;
}

/* LOGIN */
.login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#111,#1c1c1c,#2b2b2b);
}

.box{
background:#1a1a1a;
padding:35px;
border-radius:25px;
width:350px;
border:1px solid rgba(212,175,55,.3);
box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.box h2{
color:#d4af37;
margin-bottom:15px;
text-align:center;
}

.box input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:12px;
background:#252525;
border:1px solid #333;
color:white;
}

.box input:focus{
outline:none;
border-color:#d4af37;
}

.container{
padding:30px;
text-align:center;
}

/* BANNER */
.banner{
height:320px;
background:linear-gradient(
135deg,
#111,
#1a1a1a,
#252525
);
border-radius:30px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
margin-bottom:30px;
border:2px solid rgba(212,175,55,.3);
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.banner h1{
font-size:55px;
letter-spacing:4px;
color:#d4af37;
}

.banner p{
margin-top:10px;
color:#cfcfcf;
font-size:18px;
}

/* TITLE */
.title{
font-size:35px;
letter-spacing:3px;
margin-bottom:20px;
color:#d4af37;
}

/* STATS */
.stats{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:25px;
}

.stat{
background:#1a1a1a;
padding:20px;
width:180px;
border-radius:20px;
border:1px solid rgba(212,175,55,.25);
}

.stat h3{
color:#d4af37;
margin-bottom:10px;
}

.stat span{
font-size:32px;
font-weight:bold;
color:white;
}

/* SEARCH */
#search{
width:320px;
padding:13px;
border:none;
border-radius:30px;
background:#1a1a1a;
color:white;
border:1px solid #333;
}

#search:focus{
outline:none;
border-color:#d4af37;
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:12px;
background:#d4af37;
color:#111;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
background:#f0cd63;
}

/* GRID */
.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

/* CARD */
.card{
width:190px;
background:#1a1a1a;
padding:15px;
border-radius:20px;
cursor:pointer;
transition:.3s;
border:1px solid rgba(212,175,55,.25);
overflow:hidden;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 10px 25px rgba(212,175,55,.15);
}

.card img{
width:100%;
height:230px;
object-fit:cover;
border-radius:15px;
}

.card p{
margin-top:12px;
font-weight:bold;
color:#d4af37;
letter-spacing:1px;
}

/* FAVORIT BADGE */
.fav{
position:absolute;
top:10px;
right:10px;
background:#d4af37;
color:#111;
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

/* DETAIL */
.detail-box{
max-width:800px;
margin:auto;
background:#1a1a1a;
padding:30px;
border-radius:25px;
border:1px solid rgba(212,175,55,.3);
}

.detail-box img{
width:100%;
height:450px;
object-fit:cover;
border-radius:20px;
margin-bottom:20px;
}

.detail-box h2{
color:#d4af37;
margin-bottom:15px;
font-size:35px;
}

.detail-box p{
color:#d0d0d0;
line-height:1.8;
}

/* MEMBERS */
.members{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:12px;
margin-top:25px;
}

.member{
background:#252525;
padding:12px;
border-radius:12px;
border:1px solid rgba(212,175,55,.2);
color:#d4af37;
font-weight:600;
transition:.3s;
}

.member:hover{
transform:scale(1.05);
}

/* DARK MODE */
.dark{
background:#000;
}

/* FOOTER */
footer{
margin-top:60px;
padding:25px;
color:#888;
border-top:1px solid rgba(212,175,55,.15);
}

/* MOBILE */
@media(max-width:768px){

.banner{
height:250px;
}

.banner h1{
font-size:30px;
}

.card{
width:45%;
}

#search{
width:90%;
}

.detail-box img{
height:280px;
}

}
</style>
</head>
<body>
 <div class="banner">
<h1>SM ENTERTAINMENT ARCHIVE</h1>
<p>
Explore legendary artists, iconic generations,
and the evolution of K-Pop under SM Entertainment
</p>
</div>

<!-- LOGIN -->
<div class="login" id="login">
<div class="box">
<h2>SM Fansite Login</h2>
<input id="user" placeholder="Nama">
<input id="pass" type="password" placeholder="Password">
<p id="err" style="color:red"></p>
<button onclick="login()">Masuk</button>
</div>
</div>

<!-- HOME -->
<div id="home" class="container hidden">

<div class="banner">
<h1>SM ENTERTAINMENT</h1>
<p>Boy Group & Girl Group Collection</p>
</div>

<h2 class="title">SM Family</h2>

<div class="stats">
<div class="stat">
<h3>Boy Group</h3>
<span>9</span>
</div>

<div class="stat">
<h3>Girl Group</h3>
<span>6</span>
</div>

<div class="stat">
<h3>Total</h3>
<span>15</span>
</div>
</div>

<button onclick="darkMode()">🌙 Dark Mode</button>

<br><br>

<input type="text" id="search" placeholder="Cari Grup..." onkeyup="searchGroup()">

<div class="grid" id="grid"></div>

<h2 style="margin-top:40px;color:#ff6f91;">❤️ Favorit</h2>
<div class="grid" id="favGrid"></div>

<footer>
© 2026 SM Fansite | Made by Manda 💖
</footer>

</div>

<!-- DETAIL -->
<div id="detail" class="container hidden">
<div class="detail-box">

<img id="img">

<h2 id="title"></h2>

<p id="desc"></p>

<p id="count"></p>

<div class="members" id="members"></div>

<button onclick="saveFav()">❤️ Favorit</button>
<button onclick="back()">⬅ Kembali</button>

</div>
</div>

<script>

const groups={

"nct 127":{img:"127.jpg",desc:"Sub-unit NCT berbasis Seoul.",members:["Johnny","Taeyong","Yuta","Doyoung","Jaehyun","Jungwoo","Mark","Haechan"]},

"nct dream":{img:"dream.jpg",desc:"Unit populer NCT.",members:["Mark","Renjun","Jeno","Haechan","Jaemin","Chenle","Jisung"]},

wayv:{img:"wayv (2).jpg",desc:"Unit NCT untuk pasar Tiongkok.",members:["Kun","Ten","Winwin","Xiaojun","Hendery","Yangyang"]},

"nct wish":{img:"wish.jpg",desc:"Unit terbaru NCT.",members:["Sion","Riku","Yushi","Jaehee","Ryo","Sakuya"]},

exo:{img:"exo.jpg",desc:"Boy group legendaris SM.",members:["Suho","Xiumin","Baekhyun","Chen","Chanyeol","D.O.","Kai","Sehun"]},

riize:{img:"riize.jpg",desc:"Boy group generasi baru.",members:["Shotaro","Eunseok","Sungchan","Wonbin","Sohee","Anton"]},

tvxq:{img:"tvxq.jpg",desc:"Legend K-Pop generasi kedua.",members:["Yunho","Changmin"]},

superjunior:{img:"sj.jpg",desc:"Boy group legendaris sejak 2005.",members:["Leeteuk","Heechul","Yesung","Shindong","Eunhyuk","Donghae","Siwon","Ryeowook","Kyuhyun"]},

shinee:{img:"shinee.jpg",desc:"Boy group ikonik SM.",members:["Onew","Key","Minho","Taemin"]},

aespa:{img:"aespa.jpg",desc:"Girl group konsep AI.",members:["Karina","Winter","Giselle","Ningning"]},

redvelvet:{img:"redvelvet.jpg",desc:"Girl group dengan konsep unik.",members:["Irene","Seulgi","Wendy","Joy","Yeri"]},

girlsgeneration:{img:"snsd.jpg",desc:"Nation's Girl Group.",members:["Taeyeon","Sunny","Tiffany","Hyoyeon","Yuri","Sooyoung","Yoona","Seohyun"]},

fx:{img:"fx.jpg",desc:"Girl group eksperimental.",members:["Victoria","Amber","Luna","Krystal"]},

ses:{img:"ses.jpg",desc:"Girl group generasi pertama.",members:["Bada","Eugene","Shoo"]},

hearts2hearts:{img:"h2h.jpg",desc:"Girl group terbaru SM.",members:["Jiwoo","Carmen","Yuha","Stella","Juun","A-na","Ian","Ye-on"]}

};

let current="";

function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==""||p==""){
document.getElementById("err").innerText="Isi semua data!";
return;
}

document.getElementById("login").style.display="none";
document.getElementById("home").classList.remove("hidden");

load();
loadFav();
}

function load(){

let grid=document.getElementById("grid");
grid.innerHTML="";

let fav=JSON.parse(localStorage.getItem("fav"))||[];

for(let g in groups){

let badge=fav.includes(g)?'<div class="fav">❤️</div>':'';

grid.innerHTML+=`
<div class="card" onclick="detail('${g}')">
${badge}
<img src="${groups[g].img}">
<p>${g.toUpperCase()}</p>
</div>
`;
}
}

function detail(g){

current=g;

home.classList.add("hidden");
detail.classList.remove("hidden");

document.getElementById("title").innerText=g.toUpperCase();
document.getElementById("desc").innerText=groups[g].desc;
document.getElementById("img").src=groups[g].img;
document.getElementById("count").innerText="👥 Total Member : "+groups[g].members.length;

let m=document.getElementById("members");
m.innerHTML="";

groups[g].members.forEach(x=>{
m.innerHTML+=`<div class="member">${x}</div>`;
});

}

function back(){
detail.classList.add("hidden");
home.classList.remove("hidden");
}

function saveFav(){

let fav=JSON.parse(localStorage.getItem("fav"))||[];

if(!fav.includes(current)){
fav.push(current);
localStorage.setItem("fav",JSON.stringify(fav));
alert("Ditambahkan ke favorit ❤️");
}

load();
loadFav();
}

function loadFav(){

let favGrid=document.getElementById("favGrid");
let fav=JSON.parse(localStorage.getItem("fav"))||[];

favGrid.innerHTML="";

fav.forEach(g=>{

favGrid.innerHTML+=`
<div class="card" onclick="detail('${g}')">
<img src="${groups[g].img}">
<p>${g.toUpperCase()}</p>
</div>
`;

});
}

function searchGroup(){

let key=document.getElementById("search").value.toLowerCase();
let cards=document.querySelectorAll("#grid .card");

cards.forEach(card=>{
card.style.display=
card.innerText.toLowerCase().includes(key)
? "block"
: "none";
});

}

function darkMode(){
document.body.classList.toggle("dark");
}

</script>

</body>
</html>
